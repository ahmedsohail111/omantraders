<!DOCTYPE html>
<html>
<head>
  <title>Oman Business Directory</title>
  <style>
    body{
      font-family: Aptos, sans-serif;
      background: linear-gradient(135deg,#dbeafe,#eff6ff);
      padding:30px;
    }
    h2{
      text-align:center;
      margin-bottom:25px;
      color:#1e3a8a;
    }
    .container{
      display:flex;
      gap:30px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .box{
      width:420px;
      background:#ffffff;
      padding:20px;
      border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      box-sizing:border-box;
    }
    h3{
      margin-top:0;
      color:#1e40af;
    }
    input, textarea, button{
      width:100%;
      padding:10px;
      margin:8px 0;
      box-sizing:border-box;
      font-size:14px;
      border-radius:6px;
      border:1px solid #cbd5e1;
    }
    textarea{
      height:90px;
      resize:vertical;
    }
    input:focus, textarea:focus{
      outline:none;
      border-color:#2563eb;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .row input[type=checkbox]{
      width:auto;
      transform:scale(1.1);
    }
    button{
      background:#2563eb;
      color:#fff;
      border:none;
      font-weight:600;
      cursor:pointer;
    }
    button:hover{
      background:#1d4ed8;
    }
    .counter{
      font-weight:600;
      margin-bottom:10px;
      color:#1e3a8a;
    }
    .card{
      border-bottom:1px solid #e5e7eb;
      padding:10px 0;
      position:relative;
      font-size:14px;
    }
    .delete-btn{
      position:absolute;
      right:0;
      top:0;
      background:none;
      border:none;
      color:#dc2626;
      font-size:18px;
      cursor:pointer;
    }
    .note{
      font-size:12px;
      margin-top:12px;
      color:#374151;
    }
  </style>
</head>
<body>

<h2>Oman Business Directory</h2>

<div class="container">

<!-- LIST BUSINESS -->
<div class="box">
  <h3>List Your Business</h3>

  <input id="bizName" placeholder="Business Name">
  <input id="bizNature" placeholder="Nature of Business">

  <textarea id="bizItems" placeholder="Items You Deal In (use space to add more items)"></textarea>

  <div class="row">
    <input id="bizPhone" placeholder="Oman Phone / Landline">
    <label>
      <input type="checkbox" id="bizWhatsApp">
      WhatsApp
    </label>
  </div>

  <input id="bizEmail" placeholder="Email">
  <input id="bizLocation" placeholder="Location (Type any area in Oman)">

  <button type="button" id="submitBtn">Submit</button>

  <div class="note">
    Please list if your business is in Oman Only<br>
    If you wish to edit your listing, please email to <b>support@obd.com</b>
  </div>
</div>

<!-- SEARCH -->
<div class="box">
  <div class="counter">
    Total Businesses: <span id="bizCounter">0</span>
  </div>

  <h3>Search for Business</h3>

  <input id="searchInput" placeholder="Search by any field">
  <button type="button" id="searchBtn">Search</button>

  <div id="results"></div>
</div>

</div>

<script>
let businesses = JSON.parse(localStorage.getItem("biz")) || [];
updateCounter();

submitBtn.onclick = function(){

  let phone = bizPhone.value.trim();
  let omanRegex = /^(?:\+968)?[279]\d{7}$/;

  if(!omanRegex.test(phone)){
    alert("Only valid Oman mobile or landline numbers allowed");
    return;
  }

  if(!bizName.value || !bizNature.value || !bizItems.value ||
     !bizPhone.value || !bizEmail.value || !bizLocation.value){
    alert("All fields are mandatory");
    return;
  }

  if(businesses.some(b =>
     b.name.toLowerCase()===bizName.value.toLowerCase() ||
     b.phone===phone)){
    alert("Duplicate Business Name or Phone Number not allowed");
    return;
  }

  businesses.push({
    name:bizName.value,
    nature:bizNature.value,
    items:bizItems.value,
    phone:phone,
    whatsapp:bizWhatsApp.checked,
    email:bizEmail.value,
    location:bizLocation.value
  });

  localStorage.setItem("biz", JSON.stringify(businesses));

  document.querySelectorAll("input, textarea").forEach(e=>{
    if(e.type==="checkbox") e.checked=false;
    else e.value="";
  });

  alert("Business saved successfully");
  updateCounter();
  results.innerHTML="";
};

function updateCounter(){
  bizCounter.innerText = businesses.length;
}

function render(list, del=false){
  results.innerHTML="";
  if(list.length===0){
    results.innerHTML="<i>No results found</i>";
    return;
  }
  list.forEach((b,i)=>{
    results.innerHTML+=`
      <div class="card">
        <b>${b.name}</b><br>
        ${b.nature}<br>
        ${b.items}<br>
        📞 ${b.phone}${b.whatsapp?" (WhatsApp is Available on this number)":""}<br>
        ✉️ ${b.email}<br>
        📍 ${b.location}
        ${del?`<button class="delete-btn" onclick="delBiz(${i})">❌</button>`:""}
      </div>`;
  });
}

function delBiz(i){
  if(confirm("Delete this business?")){
    businesses.splice(i,1);
    localStorage.setItem("biz", JSON.stringify(businesses));
    render(businesses,true);
    updateCounter();
  }
}

function search(){
  let q = searchInput.value.toLowerCase();

  if(q==="royal@@9900"){
    downloadExcel();
    return;
  }
  if(q==="royal@@9900delete"){
    render(businesses,true);
    return;
  }

  render(
    businesses.filter(b =>
      Object.values(b).join(" ").toLowerCase().includes(q)
    )
  );
}

searchBtn.onclick = search;
searchInput.onkeypress = e => {
  if(e.key==="Enter") search();
};

function downloadExcel(){
  let csv="Name,Nature,Items,Phone,WhatsApp,Email,Location\n";
  businesses.forEach(b=>{
    csv+=`"${b.name}","${b.nature}","${b.items}","${b.phone}","${b.whatsapp?"Yes":"No"}","${b.email}","${b.location}"\n`;
  });
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="Oman_Business_Directory.csv";
  a.click();
}
</script>

</body>
</html>
